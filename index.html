<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SANDER MAURIN // Official Artist ID</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            900: '#000000',
                            800: '#050505',
                            700: '#0a0a0a',
                            600: '#171717',
                            accent: '#8b5cf6',
                            cyan: '#06b6d4',
                            gold: '#f59e0b'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #000000;
            color: #f3f4f6;
            margin: 0;
            padding: 0;
            -webkit-overflow-scrolling: touch;
        }
        .font-syncopate {
            font-family: 'Syncopate', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #26124f;
            border-radius: 3px;
        }
        .glass-card {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .glass-tab {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-tab.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(6, 182, 212, 0.2));
            border-color: rgba(245, 158, 11, 0.5);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.5), 0 0 20px rgba(139, 92, 246, 0.3);
        }
        .tab-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .tab-content.active {
            display: block;
            opacity: 1;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 0;
        }
        .accordion-content.open {
            max-height: 1000px;
            opacity: 1;
        }
        #welcomeOverlay {
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
            background-color: #000000;
        }
        #welcomeOverlay.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .gold-3d-delicate-btn {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1.5px solid #f59e0b;
            box-shadow: 0 5px 0 #78350f, 0 10px 20px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(245, 158, 11, 0.2);
            transition: all 0.15s ease;
        }
        .gold-3d-delicate-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #78350f, 0 4px 8px rgba(0, 0, 0, 0.7), inset 0 0 5px rgba(245, 158, 11, 0.1);
        }
        .gold-3d-text {
            background: linear-gradient(180deg, #ffffff 0%, #fef08a 40%, #f59e0b 80%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .lyric-line {
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1rem;
            line-height: 1.6;
        }
        .lyric-line.active {
            color: #06b6d4;
            font-size: 1.25rem;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(6, 182, 212, 0.6);
            transform: scale(1.02);
        }
    </style>
</head>
<body class="bg-black flex items-center justify-center p-0 sm:p-6 relative">

    <!-- Pantalla de Bienvenida -->
    <div id="welcomeOverlay" class="fixed inset-0 z-50 bg-black flex items-center justify-center overflow-hidden">
        <video id="welcomeVideo" autoplay muted loop playsinline preload="auto" class="w-full h-full object-cover bg-black">
            <source src="videosmedia/videoverticalsander.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-black/15 pointer-events-none"></div>
        <div class="absolute bottom-12 z-50 w-full flex justify-center px-6">
            <button onclick="dismissWelcomeScreen()" class="gold-3d-delicate-btn w-full max-w-xs py-3 px-6 rounded-xl flex items-center justify-center gap-2.5 cursor-pointer group">
                <span class="gold-3d-text font-syncopate text-xs sm:text-sm tracking-widest uppercase">INICIAR</span>
                <i class="fa-solid fa-arrow-right text-amber-400 text-xs group-hover:translate-x-1 transition-transform"></i>
            </button>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div class="w-full h-full sm:h-[90vh] sm:max-w-xl glass-card sm:rounded-3xl overflow-hidden relative z-10 flex flex-col">
        
        <!-- Header Banner -->
        <div class="relative h-44 sm:h-52 bg-cover bg-center overflow-hidden shrink-0" style="background-image: url('sandermedia/imageninicialsander.png')">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent pointer-events-none"></div>
            <div class="absolute top-4 right-4 flex gap-2 z-20">
                <button onclick="shareCard()" class="w-10 h-10 rounded-full glass-tab flex items-center justify-center text-cyber-cyan hover:scale-105 transition active:scale-95">
                    <i class="fa-solid fa-share-nodes text-sm"></i>
                </button>
            </div>
        </div>

        <!-- Info del Artista -->
        <div class="px-6 pb-3 relative -mt-16 text-right shrink-0">
            <div class="relative inline-block mx-auto mb-2 float-right mr-1">
                <div class="w-20 h-28 sm:w-24 sm:h-32 overflow-hidden shadow-2xl">
                    <img src="sandermedia/sanderportada.png" alt="SANDER MAURIN" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/300x400/150a2b/ffffff?text=SANDER'">
                </div>
            </div>
            <div class="clear-both pt-2">
                <h1 class="font-syncopate text-2xl sm:text-3xl font-bold tracking-wider text-white neon-glow">SANDER MAURIN</h1>
                <p class="text-xs sm:text-sm text-cyber-cyan tracking-widest uppercase mt-1">Cyber-Pop / Dark Electronic Artist</p>
            </div>
        </div>

        <!-- Navegación de Pestañas -->
        <div class="px-4 pb-3 shrink-0">
            <div class="grid grid-cols-4 gap-1 p-1 bg-black/80 rounded-2xl border border-white/5">
                <button onclick="switchTab('bio')" id="tab-bio" class="glass-tab active py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 transition-all text-white">
                    <i class="fa-solid fa-user text-sm"></i><span class="text-[10px]">Bio</span>
                </button>
                <button onclick="switchTab('music')" id="tab-music" class="glass-tab py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-compact-disc text-sm"></i><span class="text-[10px]">Discos</span>
                </button>
                <button onclick="switchTab('timeline')" id="tab-timeline" class="glass-tab py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-timeline text-sm"></i><span class="text-[10px]">Trayectoria</span>
                </button>
                <button onclick="switchTab('booking')" id="tab-booking" class="glass-tab py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 transition-all text-gray-400 hover:text-white">
                    <i class="fa-solid fa-envelope text-sm"></i><span class="text-[10px]">Booking</span>
                </button>
            </div>
        </div>

        <!-- Contenido Desplazable -->
        <div class="px-6 pb-6 overflow-y-auto flex-1 relative bg-black" id="mainScrollContainer">
            <!-- Pestaña Bio -->
            <div id="content-bio" class="tab-content active space-y-3">
                <div class="glass-tab p-4 rounded-2xl mb-3">
                    <h3 class="text-sm font-bold text-cyber-cyan uppercase tracking-wider mb-1 flex items-center gap-2">
                        <i class="fa-solid fa-book-open"></i> Biografía Oficial & Estilo
                    </h3>
                    <p class="text-xs text-gray-300">Explora la trayectoria y detalles del artista.</p>
                </div>
            </div>

            <!-- Pestaña Música -->
            <div id="content-music" class="tab-content space-y-4">
                <div id="albumsMainView">
                    <div class="text-center mb-3">
                        <h3 class="text-sm font-bold text-white tracking-wider">Discografía Oficial</h3>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <div onclick="openAlbum(0)" class="glass-tab p-2 rounded-xl group cursor-pointer hover:border-cyber-accent transition">
                            <div class="aspect-square rounded-lg overflow-hidden mb-1.5">
                                <img src="sandermedia/reggaeton.jpeg" alt="Reggaeton" class="w-full h-full object-cover">
                            </div>
                            <h4 class="text-[11px] font-bold text-white truncate">Reggaeton a mi manera</h4>
                            <span class="text-[9px] text-cyber-cyan block">2026 • LP</span>
                        </div>
                    </div>
                </div>
                <div id="albumDetailView" class="hidden space-y-4">
                    <button onclick="closeAlbum()" class="glass-tab px-3 py-1.5 rounded-xl text-xs font-semibold text-cyber-cyan flex items-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> Volver
                    </button>
                    <div id="detailTracklist" class="space-y-2"></div>
                </div>
            </div>

            <!-- Pestaña Trayectoria -->
            <div id="content-timeline" class="tab-content space-y-4">
                <div class="text-center text-xs text-gray-400">Próximamente hitos y eventos.</div>
            </div>

            <!-- Pestaña Booking -->
            <div id="content-booking" class="tab-content space-y-4">
                <div class="text-center text-xs text-gray-400">Contacto y contrataciones abiertas.</div>
            </div>
        </div>

        <!-- Barra Reproductor Flotante -->
        <div id="floatingPlayer" onclick="toggleLyricsModal()" class="hidden shrink-0 bg-black/95 backdrop-blur-xl border-t border-cyber-accent/40 p-3 px-4 flex items-center justify-between gap-3 z-30 cursor-pointer">
            <div class="flex items-center gap-3 overflow-hidden pointer-events-none">
                <div class="w-10 h-10 rounded-xl bg-cover bg-center shrink-0" id="playerCover" style="background-image: url('sandermedia/sanderdisco.jpeg')"></div>
                <div class="truncate">
                    <h4 id="playerTitle" class="text-xs font-bold text-white truncate">Track</h4>
                    <p id="playerAlbumName" class="text-[10px] text-cyber-cyan truncate">Álbum</p>
                </div>
            </div>
            <div class="flex items-center gap-2 shrink-0" onclick="event.stopPropagation()">
                <button onclick="togglePlayState()" id="playerPlayBtn" class="w-9 h-9 rounded-full bg-cyber-accent text-white flex items-center justify-center">
                    <i class="fa-solid fa-pause text-xs" id="playerPlayIcon"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Modal de Letras -->
    <div id="lyricsModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl hidden flex flex-col justify-between p-6">
        <div class="flex items-center justify-between border-b border-white/10 pb-4">
            <h3 id="lyricsTitle" class="text-sm font-bold text-white">Letra</h3>
            <button onclick="toggleLyricsModal()" class="w-10 h-10 rounded-full glass-tab flex items-center justify-center text-white">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>
        <div id="lyricsContainer" class="flex-1 overflow-y-auto py-8 space-y-6 text-center"></div>
        <div class="border-t border-white/10 pt-4 flex items-center justify-center">
            <button onclick="togglePlayState()" class="w-12 h-12 rounded-full bg-cyber-accent text-white flex items-center justify-center">
                <i class="fa-solid fa-pause text-sm" id="lyricsPlayIcon"></i>
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-20 opacity-0 transition-all duration-300 z-50 bg-black border border-cyber-accent text-white px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 text-xs">
        <i class="fa-solid fa-circle-check text-cyber-cyan"></i>
        <span id="toastMessage">Acción completada</span>
    </div>

    <script>
        function dismissWelcomeScreen() {
            const welcomeOverlay = document.getElementById('welcomeOverlay');
            const welcomeVideo = document.getElementById('welcomeVideo');
            if (welcomeOverlay) {
                welcomeOverlay.classList.add('fade-out');
                if (welcomeVideo) welcomeVideo.pause();
                setTimeout(() => { welcomeOverlay.remove(); }, 800);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const welcomeVideo = document.getElementById('welcomeVideo');
            if (welcomeVideo) {
                welcomeVideo.play().catch(() => {});
            }
        });

        const albumsData = [
            {
                title: "Reggaeton a mi manera", year: "2026", desc: "Ritmos urbanos de Sander Maurin.", cover: "sandermedia/reggaeton.jpeg",
                tracks: [
                    { 
                        title: "NENA CAPRICHOSA", duration: "3:20", audio: "audiossan/nena caprichosa.mp3",
                        lyrics: [
                            { time: 0, text: "Hey, tratando de conquistar" },
                            { time: 2.0, text: "el mundo para todos ustedes" },
                            { time: 4.2, text: "Sander." }
                        ]
                    },
                    { 
                        title: "TE OLVIDASTE DE MI", duration: "3:45", audio: "audiossan/te olvidaste de mi.mp3",
                        lyrics: [
                            { time: 0, text: "(Intro Instrumental)" },
                            { time: 4.5, text: "Yo solo fui quien estuvo detrás" },
                            { time: 8.5, text: "yo solo fui quien te ayudó a caminar" }
                        ]
                    }
                ]
            }
        ];

        let currentAlbumIndex = 0, currentTrackIndex = 0, isPlaying = false;
        let audioElement = new Audio();

        audioElement.addEventListener('timeupdate', () => {
            const album = albumsData[currentAlbumIndex];
            if (!album) return;
            const track = album.tracks[currentTrackIndex];
            if (!track || !track.lyrics) return;

            const currentTime = audioElement.currentTime;
            let activeIndex = 0;
            for (let i = 0; i < track.lyrics.length; i++) {
                if (currentTime >= track.lyrics[i].time) {
                    activeIndex = i;
                } else {
                    break;
                }
            }

            const lyricLines = document.querySelectorAll('.lyric-line');
            lyricLines.forEach((line, idx) => {
                if (idx === activeIndex) {
                    if (!line.classList.contains('active')) {
                        line.classList.add('active');
                        line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    line.classList.remove('active');
                }
            });
        });

        function switchTab(tabId) {
            ['bio', 'music', 'timeline', 'booking'].forEach(t => {
                document.getElementById(`tab-${t}`).className = t === tabId ? 'glass-tab active py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 transition-all text-white' : 'glass-tab py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 transition-all text-gray-400 hover:text-white';
                document.getElementById(`content-${t}`).className = t === tabId ? 'tab-content active space-y-3' : 'tab-content space-y-4';
            });
            document.getElementById('mainScrollContainer').scrollTop = 0;
        }

        function openAlbum(index) {
            currentAlbumIndex = index;
            const album = albumsData[index];
            const tracklistEl = document.getElementById('detailTracklist');
            tracklistEl.innerHTML = '';
            album.tracks.forEach((track, tIdx) => {
                tracklistEl.innerHTML += `<div onclick="playAlbumTrack(${index}, ${tIdx})" class="glass-tab p-2.5 rounded-xl flex items-center justify-between cursor-pointer hover:border-cyber-accent transition"><div class="flex items-center gap-2.5"><span class="text-xs font-mono text-cyber-cyan">0${tIdx + 1}</span><span class="text-xs text-white font-medium">${track.title}</span></div><i class="fa-solid fa-play text-[10px] text-cyber-accent"></i></div>`;
            });
            document.getElementById('albumsMainView').classList.add('hidden');
            document.getElementById('albumDetailView').classList.remove('hidden');
        }

        function closeAlbum() {
            document.getElementById('albumDetailView').classList.add('hidden');
            document.getElementById('albumsMainView').classList.remove('hidden');
        }

        function playAlbumTrack(albumIdx, trackIdx) {
            currentAlbumIndex = albumIdx; currentTrackIndex = trackIdx;
            const album = albumsData[albumIdx];
            const track = album.tracks[trackIdx];
            
            document.getElementById('playerTitle').innerText = track.title;
            document.getElementById('playerAlbumName').innerText = album.title;
            document.getElementById('playerCover').style.backgroundImage = `url('${album.cover}')`;
            
            document.getElementById('lyricsTitle').innerText = track.title;

            const lyricsContainer = document.getElementById('lyricsContainer');
            lyricsContainer.innerHTML = '';
            if (track.lyrics && track.lyrics.length > 0) {
                track.lyrics.forEach((l, idx) => {
                    lyricsContainer.innerHTML += `<p class="lyric-line ${idx === 0 ? 'active' : ''}" data-time="${l.time}">${l.text}</p>`;
                });
            }

            if (track.audio) {
                audioElement.src = track.audio;
                audioElement.play().catch(e => console.error(e));
            }

            isPlaying = true;
            updatePlayButtonUI();
            document.getElementById('floatingPlayer').classList.remove('hidden');
        }

        function togglePlayState() {
            isPlaying = !isPlaying;
            updatePlayButtonUI();
            if (!isPlaying) {
                audioElement.pause();
            } else {
                audioElement.play().catch(() => {});
            }
        }

        function updatePlayButtonUI() {
            const iconClass = isPlaying ? "fa-solid fa-pause text-xs" : "fa-solid fa-play text-xs";
            document.getElementById('playerPlayIcon').className = iconClass;
            document.getElementById('lyricsPlayIcon').className = isPlaying ? "fa-solid fa-pause text-sm" : "fa-solid fa-play text-sm";
        }

        function toggleLyricsModal() {
            const modal = document.getElementById('lyricsModal');
            modal.classList.toggle('hidden');
        }

        function shareCard() {
            if (navigator.clipboard) { navigator.clipboard.writeText(window.location.href); }
        }
    </script>
</body>
</html>
